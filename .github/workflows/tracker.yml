name: auction-tracker
on:
  schedule:
    - cron: '*/30 * * * *'      # keeps one run queued so tracking never stops
  workflow_dispatch: {}
concurrency:
  group: tracker
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Run tracker (about 5h40m, then the next run takes over)
        env:
          TRACKER_MAX_SECONDS: '20400'
        run: |
          git config user.name "tracker"
          git config user.email "tracker@users.noreply.github.com"
          ( while true; do sleep 120; git add -A; git commit -qm "state" || true; git push -q || true; done ) &
          python cloud_tracker.py
      - name: Save state
        if: always()
        run: |
          git add -A
          git commit -qm "state" || true
          git push -q || true
